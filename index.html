<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0E6B65" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- ── SEO ── -->
    <title>農業のための天気アプリ Orch.Weather｜積算温度・去年比較・節気のふりかえり</title>
    <meta name="description" content="農家が現場で作った天気アプリ。気温、降水量、積算温度、日照などを自動で計算し、去年・5年平均・ほかの地点と比べて「今年は遅い」を数字で確かめられます。二十四節気ごとのふりかえり、午前・午後・夜間に分けたリスク表示、雨は「カッパが要るか」まで。無料で使えます。" />
    <link rel="canonical" href="https://weather.orch-app.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Orch.Weather" />
    <meta property="og:title" content="「今年は遅い」が、数字で見える。農業の天気アプリ Orch.Weather" />
    <meta property="og:description" content="気温、降水量、積算温度、日照などを、去年や5年平均、ほかの地点と並べて比べる農業の天気アプリ。二十四節気ごとのふりかえりと、時間別のリスク表示で今日の作業も決まる。無料。" />
    <meta property="og:url" content="https://weather.orch-app.com/" />
    <meta property="og:image" content="https://weather.orch-app.com/og-image.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ja_JP" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="「今年は遅い」が、数字で見える。農業の天気アプリ Orch.Weather" />
    <meta name="twitter:description" content="気温、降水量、積算温度、日照などを、去年や5年平均、ほかの地点と並べて比べる農業の天気アプリ。二十四節気ごとのふりかえりと、時間別のリスク表示で今日の作業も決まる。無料。" />
    <meta name="twitter:image" content="https://weather.orch-app.com/og-image.png?v=2" />

    <!-- 構造化データ（WebApplication） -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Orch.Weather",
      "url": "https://weather.orch-app.com/",
      "description": "農家が現場で作った天気アプリ。気温、降水量、積算温度、日照などを自動で計算し、去年・5年平均・ほかの地点と比べて「今年は遅い」を数字で確かめられます。二十四節気ごとのふりかえり、午前・午後・夜間に分けたリスク表示、雨は「カッパが要るか」まで。無料で使えます。",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "inLanguage": "ja",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "JPY"
      }
    }
    </script>
    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && !root.firstChild) {
          root.style.cssText = 'display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;';
          root.innerHTML = '<div style="text-align:center;font-family:sans-serif;color:#475569;max-width:400px"><img src="/icons/yamamatsu-mark-color.svg" style="width:48px;height:48px;margin-bottom:16px"><br><b style="color:#e11d48">起動エラーが発生しました</b><br><small style="display:block;margin-top:8px;word-break:break-all;color:#94a3b8">' + (e.message || String(e)) + '</small></div>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var root = document.getElementById('root');
        if (root && !root.firstChild) {
          root.style.cssText = 'display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;';
          root.innerHTML = '<div style="text-align:center;font-family:sans-serif;color:#475569;max-width:400px"><img src="/icons/yamamatsu-mark-color.svg" style="width:48px;height:48px;margin-bottom:16px"><br><b style="color:#e11d48">起動エラーが発生しました</b><br><small style="display:block;margin-top:8px;word-break:break-all;color:#94a3b8">' + String(e.reason) + '</small></div>';
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
